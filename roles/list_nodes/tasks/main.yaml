---
- name: List Proxmox nodes
  ansible.builtin.command:
    argv: "{{ proxmox_library_nodes_argv }}"
  environment:
    PROXMOX_PASSWORD: "{{ proxmox_password }}"
  register: proxmox_library_raw
  changed_when: false
  no_log: true
  vars:
    proxmox_library_nodes_argv:
      - "{{ proxmox_library_bin | default(role_path | dirname | dirname ~ '/proxmox-library', true) }}"
      - --host
      - "{{ proxmox_host }}"
      - --port
      - "{{ proxmox_port | default(8006) | string }}"
      - --user
      - "{{ proxmox_user }}"
      - nodes

- name: Read Proxmox nodes
  ansible.builtin.set_fact:
    proxmox_nodes: "{{ (proxmox_library_raw.stdout | from_json).nodes }}"
